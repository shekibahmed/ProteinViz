[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proteinviz"
version = "0.2.0"
description = "Provenance-first explorer for protein–protein interactions, structures, interfaces and compound–target activity."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Shekib Ahmed" }]
keywords = [
    "bioinformatics",
    "protein-protein-interaction",
    "structural-biology",
    "alphafold",
    "molstar",
    "string-db",
    "chembl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "gemmi>=0.7",
    "biopython>=1.84",
    "networkx>=3.2",
    "typer>=0.12",
    # Web app. Regular dependencies, not an extra, so lockfile-based hosts (Streamlit
    # Community Cloud runs `uv.lock`) install them. Core modules still never import them.
    "streamlit>=1.45",
    "molviewspec>=1.8",
    "plotly>=5.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Kept so `pip install "proteinviz[app]"` keeps working; the app deps are now in the base install.
app = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.scripts]
proteinviz = "proteinviz.cli:app"

[project.urls]
Homepage = "https://github.com/shekibahmed/ProteinViz"
Issues = "https://github.com/shekibahmed/ProteinViz/issues"
Source = "https://github.com/shekibahmed/ProteinViz"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinviz"]

[tool.hatch.build.targets.sdist]
include = ["src/proteinviz", "README.md", "LICENSE", "DATA_LICENSES.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # scientific typography (–, −, Å) is intentional

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"streamlit".msg = "The proteinviz core must not depend on Streamlit; put UI code in proteinviz.app."

[tool.ruff.lint.per-file-ignores]
"src/proteinviz/app/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits real web APIs (run with PROTEINVIZ_LIVE=1)"]

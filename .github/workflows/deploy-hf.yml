name: Deploy to Hugging Face Space

# Free CPU Space (Docker SDK). No-op until configured:
#   1. Create a Docker Space on huggingface.co (free CPU basic hardware).
#   2. Repo settings → Variables: HF_SPACE = "<user>/<space-name>"
#   3. Repo settings → Secrets: HF_TOKEN = a write token
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cp deploy/huggingface/README.md /tmp/SPACE_README.md
          uvx --from huggingface_hub hf upload "${{ vars.HF_SPACE }}" . . --repo-type space \
            --exclude ".git/*" --exclude "tests/*" --exclude "docs/*" --exclude ".venv/*" \
            --commit-message "Deploy ${GITHUB_SHA::7}"
          uvx --from huggingface_hub hf upload "${{ vars.HF_SPACE }}" /tmp/SPACE_README.md README.md \
            --repo-type space --commit-message "Space card"

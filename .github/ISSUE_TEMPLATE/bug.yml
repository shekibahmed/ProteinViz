name: Bug report
description: Something is broken or shows wrong data
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: Permalink
      description: Paste the page URL (it encodes your query), if relevant.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Hosted demo or local? Version (`proteinviz version`), OS, Python.
